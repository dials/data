name: xia2.ssx output of processing lysozyme SSX data set from I24
author: James Beilsten-Edmands (2026)
license: CC-BY 4.0
description: >
  Processed integrated datafiles from ssx processing of 10.5281/ZENODO.17160798 (lysozyme from beamline 
  I24 at Diamond Light Source).

  Processed with command xia2.ssx image=lysozyme_25keV.nxs unit_cell=79,79,38,90,90,90
  space_group=P43212, in January 2026. Intended for testing data reduction programs on SSX
  data originating in nxs files. Integrated files contain data from 21 crystals.
  

